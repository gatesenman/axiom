[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "1.0.0"
description = "Axiom — enterprise desktop studio for AI-driven mathematical modeling, simulation, and optimization."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "lark>=1.1",
  "highspy>=1.7",
  "pulp>=2.8,<2.10",
  "numpy>=1.26",
  "scipy>=1.12",
  "simpy>=4.1",
  "openpyxl>=3.1",
  "reportlab>=4.1",
  "httpx>=0.27",
  "socksio>=1.0",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "ortools>=9.10",
  "pyomo>=6.7",
  "cvxpy>=1.5",
  "jsonschema>=4.21",
  "ecos>=2.0",
  "cvxopt>=1.3",
  "mip>=1.15",
  "pyscipopt>=5.0",
  "casadi>=3.6",
  "SALib>=1.4",
  "pymoo>=0.6",
  "openmdao>=3.30",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
nlp = ["cyipopt>=1.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom*"]

[tool.setuptools.package-data]
axiom = ["modeling/grammar.lark", "modeling/schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
